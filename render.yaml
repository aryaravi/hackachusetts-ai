services:
  - type: web
    name: omnigridx-judge-demo
    runtime: python
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && pip install .
    startCommand: python -m uvicorn omnigridx.web.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: OMNIGRIDX_MODE
        value: demo-public
      - key: WEB_CONCURRENCY
        value: "1"
